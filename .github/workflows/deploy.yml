name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:static
      # Prerendered HTML lands under the basename dir while vite assets stay
      # at the client root; Pages serves the artifact at /awesome-stars/, so
      # merge them into one site root.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R build/client/awesome-stars/. _site/
          cp -R build/client/assets _site/assets
          cp build/client/favicon.ico _site/
          cp build/client/__spa-fallback.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
