name: Refresh stars

# Every committed list (data/snapshots/<owner>/<repo>/) gets one weekly
# hourly slot: slot = (weekday-1)*24 + hour over Mon+Tue = 48 slots, lists
# sorted alphabetically. One list per hour stays far under the 5000/hr API
# budget. Grow past 48 lists -> add Wednesday (1,2,3) below.
on:
  schedule:
    - cron: "17 * * * 1,2"
  workflow_dispatch:
    inputs:
      target:
        description: "owner/repo to refresh (empty = pick by current hour slot)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-stars

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick list
        id: pick
        run: |
          TARGET="${{ inputs.target }}"
          if [ -z "$TARGET" ]; then
            LISTS=$(cd data/snapshots && ls -d */*/ | sed 's:/$::' | LC_ALL=C sort)
            COUNT=$(echo "$LISTS" | wc -l)
            SLOT=$(( ($(date -u +%u) - 1) * 24 + $(date -u +%-H) ))
            echo "slot $SLOT of $COUNT lists"
            if [ "$SLOT" -ge "$COUNT" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TARGET=$(echo "$LISTS" | sed -n "$((SLOT + 1))p")
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "owner=${TARGET%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET##*/}" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.pick.outputs.skip != 'true'
        run: npm ci
      - name: Fetch stars
        if: steps.pick.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.STARS_PAT || github.token }}
        run: node --experimental-strip-types scripts/refresh-list.ts "${{ steps.pick.outputs.owner }}" "${{ steps.pick.outputs.repo }}"
      - name: Commit data
        id: commit
        if: steps.pick.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh stars (${{ steps.pick.outputs.target }})"
            git pull --rebase origin master
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with github.token never trigger on:push workflows.
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master --repo ${{ github.repository }}
